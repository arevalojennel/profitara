name: profitara
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  uuid: ^4.4.0
  intl: ^0.19.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  flutter_bloc: ^8.1.3
  sqflite: ^2.3.0
  path: ^1.8.3
  equatable: ^2.0.5
  liquid_pull_to_refresh: ^3.0.1

  get: ^4.7.3
  go_router: ^14.6.2

  curved_navigation_bar: ^1.0.3



dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7


  flutter_lints: ^3.0.0




flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/fonts/
    - assets/fonts/poppins/
    - assets/fonts/inter/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-BoldItalic.ttf
          weight: 700
          style: italic
    
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/inter/InterDisplay-Regular.ttf
        - asset: assets/fonts/inter/InterDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/InterDisplay-Bold.ttf
          weight: 700

  